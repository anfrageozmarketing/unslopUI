# Command Center - private. Default: no published port; reach it through the reverse proxy or an SSH tunnel.
name: command-center

services:
  command-center:
    build: .
    container_name: command-center
    restart: unless-stopped
    env_file: .env
    environment:
      VAULT_DIR: /vault
      TRUST_PROXY: "1"            # only because Traefik sits in front; remove if you publish a port
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.cc.rule=Host(`${CC_HOST}`)
      - traefik.http.routers.cc.entrypoints=websecure
      - traefik.http.routers.cc.tls=true
      - traefik.http.routers.cc.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.cc.loadbalancer.server.port=8080
      # Second layer: only these source IPs may reach the app. Fill CC_ALLOW_IPS in .env (comma separated CIDRs).
      - traefik.http.middlewares.cc-ip.ipallowlist.sourcerange=${CC_ALLOW_IPS}
      - traefik.http.routers.cc.middlewares=cc-ip

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
